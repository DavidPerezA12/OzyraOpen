<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ozyra">
  <style>
    :root {
      --tile: #111111;
      --ring: #ffffff;
      --planet-from: #f5f5f5;
      --planet-to: #7a7a7a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --tile: #ebebeb;
        --ring: #111111;
        --planet-from: #1a1a1a;
        --planet-to: #8a8a8a;
      }
    }
    .tile { fill: var(--tile); }
    .ring { stroke: var(--ring); }
    .planet-from { stop-color: var(--planet-from); }
    .planet-to { stop-color: var(--planet-to); }
  </style>
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop class="planet-from" offset="0" />
      <stop class="planet-to" offset="1" />
    </linearGradient>
    <mask id="ring-gap">
      <rect width="512" height="512" fill="#ffffff" />
      <path d="M70.6 330.9A200 60 -22 0 0 441.4 181.1" fill="none" stroke="#000000" stroke-width="60" stroke-linecap="round" />
    </mask>
  </defs>
  <rect class="tile" width="512" height="512" rx="116" />
  <path class="ring" d="M70.6 330.9A200 60 -22 0 1 441.4 181.1" fill="none" stroke-width="28" stroke-linecap="round" />
  <circle cx="256" cy="256" r="122" fill="url(#planet)" mask="url(#ring-gap)" />
  <path class="ring" d="M70.6 330.9A200 60 -22 0 0 441.4 181.1" fill="none" stroke-width="28" stroke-linecap="round" />
</svg>
